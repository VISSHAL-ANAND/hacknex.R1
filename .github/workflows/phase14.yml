name: Phase 14 - Final Robustness Stress
on:
  pull_request:
    paths: ["backend/**","tests/test_phase14_final_robustness.py",".github/workflows/phase14.yml"]
  workflow_dispatch:
jobs:
  robustness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests/test_phase14_final_robustness.py
      - run: python -m pytest -q
