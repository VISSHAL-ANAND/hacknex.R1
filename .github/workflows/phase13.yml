name: Phase 13 - Generalization Benchmark
on:
  pull_request:
    paths: ["backend/**","tests/test_phase13_generalization_benchmark.py",".github/workflows/phase13.yml"]
  workflow_dispatch:
jobs:
  generalization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests/test_phase13_generalization_benchmark.py
      - run: cat docs/results/phase13_generalization.json
      - uses: actions/upload-artifact@v4
        with: {name: phase13-generalization, path: docs/results/phase13_generalization.json}
