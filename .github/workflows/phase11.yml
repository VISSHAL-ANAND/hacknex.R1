name: Phase 11 - Adversarial Benchmark

on:
  pull_request:
    paths:
      - "backend/**"
      - "tests/test_phase11_adversarial_benchmark.py"
      - ".github/workflows/phase11.yml"
  workflow_dispatch:

jobs:
  adversarial-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests/test_phase11_adversarial_benchmark.py
      - run: cat docs/results/phase11_adversarial_baseline.json
      - uses: actions/upload-artifact@v4
        with:
          name: phase11-adversarial-baseline
          path: docs/results/phase11_adversarial_baseline.json
